version: '1.0'
dataset:
  id: bnkp-xdb7
  nombre: Superservicios - Información Comercial No Residencial
  publicador: Superintendencia de Servicios Públicos Domiciliarios (SSPD)
  url_portal: https://www.datos.gov.co/d/bnkp-xdb7
  url_csv_completo: https://www.datos.gov.co/api/views/bnkp-xdb7/rows.csv?accessType=DOWNLOAD
  filas: 402500
  columnas: 48
  cobertura: 2021-07 a 2022-06 (12 períodos mensuales)
  periodicidad_declarada: Semestral
  ultima_carga_de_datos: '2023-05-26'
  contiene_consumo_observado: true
  ambito: >-
    Sistema Interconectado Nacional. 32 prestadores en 14 departamentos de los Llanos y la
    Amazonía: Meta, Casanare, Huila, Putumayo, Guaviare y Caquetá, entre otros. Encabezan
    Electrificadora del Meta y Electrificadora del Huila.
  estado: >-
    Cuarta fuente. Entra por el régimen interconectado, la tarifa aplicada y el eje de
    propiedad, que la fuente ZNI no tiene. No reemplaza a ninguna de las tres anteriores.
advertencia: >-
  Diccionario documental. Como en las otras fuentes de este publicador, el portal no
  declara descripción para sus columnas. Toda lectura de significado aquí es inferida y
  está marcada como tal.
por_que_entra:
  - Es del Sistema Interconectado Nacional, de modo que le aplica el régimen de la
    Resolución CREG 119 de 2007, a diferencia de la fuente ZNI.
  - Publica `tarifa_aplicada`, que es el costo unitario que EPM y CHEC publican como
    especificación. Es el puente entre el dominio tarifario y el consumo observado.
  - Publica `car_t440_car_inver` con valores 100, 50 y 0, que es el eje de propiedad del
    activo. Por eso R08 y R09 sí aplican aquí.
  - Publica energía reactiva, que ninguna de las otras tres fuentes tiene.
  - Publica fecha de expedición de factura, que habilita una medida de rezago.
limitaciones_declaradas:
  periodos: >-
    Solo 12 períodos mensuales. No alcanza el mínimo de 49 que exige el protocolo de cartas
    de control, de modo que CART01 no es ejecutable sobre esta fuente.
  caida_de_volumen: >-
    El volumen se desploma dentro de la propia ventana: 101.608 registros en 2021-07 frente
    a 977 en 2022-05 y 988 en 2022-06. Los últimos tres períodos están prácticamente vacíos,
    de modo que los períodos útiles son unos nueve. Es un defecto de completitud de la
    fuente, no del recorte, y debe declararse en cualquier agregado por período.
  oportunidad: >-
    `car_t440_fec_exp` mide el rezago entre el período facturado y la expedición de la
    factura. Eso es oportunidad del servicio, no del dato. OPO01 está especificado sobre la
    disponibilidad de la publicación, así que esta evidencia NO lo cierra tal como está
    escrito: o se reespecifica el control, o se registra como indicador distinto.
granularidad: >-
  Registro de facturación por usuario (NIU) y período mensual. Las fechas que trae son de
  factura, no de consumo: `car_t440_dias_fact` muestra ciclos de 28 a 32 días, de modo que
  cada fila cubre un mes de consumo y no un día.
clave_candidata:
  identificador:
  - id_factura
  - niu
  periodo:
  - car_carg_ano
  - car_carg_mes
  empresa:
  - identificador_empresa
  estado: Pendiente de validación; no asumir unicidad.
series:
  clave: identificador_empresa + car_t440_sector + período mensual.
  variables_prioritarias:
  - consumos
  - tarifa_aplicada
  - valor_total_facturado
  condiciones:
  - Doce períodos no habilitan cartas de control; se usa para reglas de fila y perfilamiento.
  - La caída de volumen hace que los agregados de los últimos meses no sean comparables.
hallazgos_de_dominio_observados:
  descripcion: Medidos sobre el conjunto completo. Son observaciones, no juicios.
  rangos_sospechosos:
  - campo: car_t440_dias_fact
    detalle: Rango de 1 a 152 días. Un ciclo de facturación de 152 días no corresponde a un mes.
  - campo: car_t440_dias_mora
    detalle: Máximo de 9.540 días, unos 26 años de mora. Requiere confirmación de la fuente.
  - campo: valor_total_facturado
    detalle: 1.443 registros negativos; mínimo -12.964.850.
  - campo: tarifa_aplicada
    detalle: Mínimo 0. Hay registros sin tarifa informada pese a tener consumo.
  fechas_incoherentes:
  - detalle: >-
      Los períodos 2022-01, 2022-02 y 2022-03 tienen facturas con fecha de expedición en
      2021-01-08, 2021-02-10 y 2021-03-10. Son facturas expedidas un año antes del período
      que declaran; parece error de año en el dato de origen.
  dominios:
  - campo: car_t440_sector
    detalle: 10 valores (C, O, I, P, AP, AC, EE, IA, DR, EA) sin catálogo publicado.
  - campo: codigo_de_zona_especial
    detalle: 60 valores; el 99,8 % de las filas lleva '0'.
  nota_sobre_variantes: >-
    A diferencia de la fuente ZNI, aquí no se detectaron variantes por espacio final ni por
    capitalización en las categóricas evaluadas.
