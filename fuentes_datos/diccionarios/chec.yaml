  url_csv_completo: https://www.datos.gov.co/api/views/c698-wqig/rows.csv?accessType=DOWNLOAD
  archivo_csv: datos/chec_c698-wqig.csv
  filas_verificadas: 40609
  columnas: 24
  cobertura: 2008-01 a 2026-09
  contiene_consumo_observado: false
  licencia_portal: CC_40_BY_SA
  estado: Seleccionado como caso de estudio; cobertura de las ocho dimensiones aún pendiente de completar.
advertencia: Diccionario documental y propuesta de controles; no es un motor ejecutable ni demuestra reglas implementadas.
granularidad: Registro tarifario por categoría y período; verificar clave y multiplicidad antes de generar series.
clave_candidata:
  categorias:
  - comercializador_codigo
  - comercializador_nombre
  - mercado_codigo
  - mercado_nombre
  - costounitariotarifa_tipomed
  - nivel_tension_codigo
  - modalidadcobro_propiedad
  - claseservicio_codigo
  - claseservicio_descri
  - claseservicio_estrato
  - costounitariotarifa_rangoconsumo
  - costounitariotarifa_tipomercado
  periodo:
  - costounitariotarifa_ano
  - costounitariotarifa_mes
  estado: Pendiente de validación; no asumir unicidad.
series:
  clave: Categorías + variable monetaria, con fecha mensual derivada.
  variables_prioritarias:
  - costounitariotarifa_cu
  - costounitariotarifa_valor_tarifa
  condiciones:
  - No mezclar conceptos, categorías o unidades.
  - Exigir continuidad temporal y resolver conflictos de clave.
  - Aplicar logaritmos solo a valores positivos; no unir meses a través de huecos.
  - Separar referencia de vigilancia; no ajustar límites con vigilancia.
  - Controlar dependencia entre series para intervalos y remuestreo.
