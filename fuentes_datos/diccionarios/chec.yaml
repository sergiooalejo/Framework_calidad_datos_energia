campos_externos_necesarios:
- campo: referencia_publicacion_original
  presente_en_csv: false
  descripcion: Documento oficial, página y valor contrastado para exactitud.
- campo: fecha_disponibilidad_real
  presente_en_csv: false
  descripcion: Evidencia histórica de cuándo estuvo disponible cada publicación; pendiente.
- campo: fecha_limite_esperada
  presente_en_csv: false
  descripcion: Plazo documentado para cada publicación; pendiente.
- campo: evidencia_temporal
  presente_en_csv: false
  descripcion: URL, archivo o registro que respalda la fecha real; pendiente.
trazabilidad:
  campos_generados:
  - sha256_archivo
  - fecha_descarga_utc
  - dataset_id
  - clave_contenido_hallazgo
  precaucion: La fecha de descarga y timestamps globales del portal no prueban publicación puntual por período.
dimensiones:
  completitud:
    control: R01/R10 y cobertura temporal definida
    requisito: Medir nulos y presencia esperada por categoría; no confundir meses anteriores a creación de categoría
      con faltantes.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  validez:
    control: R02/R03/R07/R11
    requisito: Dominios por concepto y fuente; R11 es detección heurística.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  unicidad:
    control: R04/R05
    requisito: Definir entidad y clave antes de calificar duplicación.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  consistencia:
    control: R06/R08/R09
    requisito: Adaptar relaciones y catálogo a cada fuente.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  integridad:
    control: INT01 control complementario propuesto
    requisito: Verificar estructura y relaciones código-nombre/catálogos. Separar de unicidad; falta implementar
      y validar.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  razonabilidad:
    control: R12 y cartas I-MR/modelos
    requisito: Evaluar patrones y alertas; anomalía no equivale a error confirmado.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  exactitud:
    control: EXA01 control complementario propuesto
    requisito: Contrastar muestra con documentos tarifarios oficiales equivalentes; reportar tamaño de muestra y
      concordancia, no extrapolar sin diseño.
    estado: propuesto_pendiente_de_implementacion_o_validacion
  oportunidad:
    control: OPO01 control complementario propuesto
    requisito: Medir fecha real de disponibilidad frente a plazo esperado documentado. No sustituir por mes de vigencia,
      fecha de descarga ni última modificación global del dataset.
    estado: propuesto_pendiente_de_implementacion_o_validacion
