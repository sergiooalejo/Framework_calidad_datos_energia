version: '1.0'
dataset:
  id: sfcd-b3ey
  nombre: Histórico de Tarifas de Energía Eléctrica – EPM (2016-2021)
  publicador: E.S.P. Empresas Públicas de Medellín - EPM, Antioquia
  url_portal: https://www.datos.gov.co/d/sfcd-b3ey
  url_csv_completo: https://www.datos.gov.co/api/views/sfcd-b3ey/rows.csv?accessType=DOWNLOAD
  archivo_csv: datos/epm_sfcd-b3ey.csv
  filas_verificadas: 3623
  columnas: 12
  cobertura: 2016-12 a 2021-12
  contiene_consumo_observado: false
  licencia_portal: CC_40_BY_SA
  estado: Seleccionado como caso de estudio; cobertura de las ocho dimensiones aún pendiente de completar.
advertencia: Diccionario documental y propuesta de controles; no es un motor ejecutable ni demuestra reglas implementadas.
granularidad: Registro tarifario por categoría y período; verificar clave y multiplicidad antes de generar series.
clave_candidata:
  categorias:
  - tipodeinformacion
  - tipodetarifa
  - tipodedato
  - rangodeconsumo
  - nivel
  periodo:
  - year
  - mes
  estado: Pendiente de validación; no asumir unicidad.
series:
  clave: Categorías + variable monetaria, con fecha mensual derivada.
  variables_prioritarias:
  - propiedadepm
  - compartido
  - propiedaddelcliente
  - punta
  - fueradepunta
  condiciones:
  - No mezclar conceptos, categorías o unidades.
  - Exigir continuidad temporal y resolver conflictos de clave.
  - Aplicar logaritmos solo a valores positivos; no unir meses a través de huecos.
  - Separar referencia de vigilancia; no ajustar límites con vigilancia.
  - Controlar dependencia entre series para intervalos y remuestreo.
variables:
- columna: tipodeinformacion
  nombre_portal: Tipo de Información
  descripcion: Modalidad tarifaria del registro, por ejemplo monomía u horaria.
  descripcion_oficial: "Tarifa Monomia Horaria \n\n-Franjas Aplicadas: \n\nHoras de punta: 9 a.m. - 12 m; 6 p.m\
    \ - 9 p.m.\n\nHoras fuera de punta: \n12 p.m - 9 a.m.; 12 m - 6 p.m y 9 p.m - 12 p.m."
  tipo_portal: text
  tipo_recomendado: texto
  rol: categoria
  unidad: No aplica
  reglas_relacionadas:
