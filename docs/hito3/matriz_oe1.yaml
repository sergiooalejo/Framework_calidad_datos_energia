marco:
  edicion_dama: DAMA-DMBOK2, segunda edición 2017, capítulo 13
  nota_edicion: Se mantienen las ocho dimensiones exigidas. La revisión posterior de DAMA añade Currency; no se mezcla
    con la edición 2017.
  iso: ISO/IEC 25012:2008; relación conceptual, no certificación ni equivalencia completa.
politica:
  requisito: Las ocho dimensiones se deben medir en EPM y CHEC; no evaluable no acredita cierre final.
  orden: Original -> perfilamiento -> aplicación por dominio -> hallazgos -> población elegible de series; nunca borrar
    el original.
  denominador_cero: valor=null, estado=sin_unidades_evaluables y motivo; nunca 0 ni 100 por defecto.
  cobertura: 100*n_evaluadas/n_elegibles, o null si n_elegibles=0; presentar junto a todo indicador.
  exclusiones: Registrar n_elegibles, n_evaluadas, n_excluidas_por_causa, n_incumplimientos y razón por fuente/control/período.
  estado_resultado:
  - pendiente_evidencia
  - pendiente_implementacion
  - sin_unidades_evaluables
  - parcial
  - cumple
  - incumple
  - informativo
  cumplimiento: Requiere evidencia, parámetros fijados, denominador positivo y cobertura completa del alcance declarado.
    Sin umbral validado, resultado informativo/provisional.
  umbral: Toda meta aquí es propuesta del proyecto o parámetro heredado, no requisito normativo atribuido a DAMA/ISO.
    Congelar tras validación previa a vigilancia.
  responsables: Roles operativos; los nombres se deben asignar en el equipo antes de ejecución.
  agregacion: No promediar indiscriminadamente tasas de celdas, filas, referencias y publicaciones. Mostrar scorecard
    de ocho dimensiones, indicadores y cobertura.
  verdad_referencia: Alertas estadísticas no equivalen a errores reales. Precision/recall/F1 validan detector contra
    etiquetas/inyecciones, no sustituyen exactitud documental.
dimensiones:
  completitud:
    definicion_operativa: Presencia de campos y observaciones requeridos para interpretar cada tarifa.
    relacion_iso:
      caracteristica: completeness
      alcance: directa_conceptual
  validez:
    definicion_operativa: Conformidad de períodos, categorías e importes con dominios documentados.
    relacion_iso:
      caracteristica: null
      alcance: sin_equivalencia_nominal_unica
  unicidad:
    definicion_operativa: Una sola representación por entidad tarifaria y período dentro del alcance definido.
    relacion_iso:
      caracteristica: null
      alcance: sin_equivalencia_nominal_unica
  consistencia:
    definicion_operativa: Coherencia de etiquetas y relaciones de tarifas al comparar categorías equivalentes.
    relacion_iso:
      caracteristica: consistency
      alcance: directa_conceptual
  integridad:
    definicion_operativa: Estructura completa y referencias de categorías resolubles en catálogos versionados.
    relacion_iso:
      caracteristica: null
      alcance: relacion_parcial_con_completeness_y_consistency
  razonabilidad:
    definicion_operativa: Comportamiento tarifario compatible con una referencia temporal y contexto documentados.
    relacion_iso:
      caracteristica: null
      alcance: sin_equivalencia_nominal_unica
  exactitud:
    definicion_operativa: Concordancia de valores con una publicación oficial equivalente y verificada.
    relacion_iso:
      caracteristica: accuracy
      alcance: directa_conceptual_con_alcance_muestral
  oportunidad:
    definicion_operativa: Disponibilidad de la publicación requerida dentro del plazo que necesita el consumidor.
    relacion_iso:
      caracteristica: currentness
      alcance: parcial_no_equivalente_a_actualidad
