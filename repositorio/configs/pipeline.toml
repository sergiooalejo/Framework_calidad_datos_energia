"bootstrap" = ["Code/Data_Acquisition_and_Understanding/cuarentena_bootstrap/bootstrap_categorias.py"]
"zscore" = ["Code/Modeling/detectores/zscore_robusto.py"]
"isolation-forest" = ["Code/Modeling/detectores/isolation_forest_referencia_vigilancia.py"]
"calibracion" = ["Code/Modeling/detectores/calibracion_cv_tasa_igualada.py"]
"sensibilidad" = ["Code/Modeling/sensibilidad/analisis_sensibilidad.py"]
"metricas" = ["-m", "Code.hito4.run"]
"metricas-historicas" = ["Code/Modeling/metricas/experimento_tasa_igualada.py"]
"sistemica" = ["Code/Modeling/regla_sistemica/calibrar_regla_sistemica.py"]
"scorecard" = ["Code/Evaluation/scorecard/generar_scorecard_oe1.py"]
"niveles-costos" = ["Code/Evaluation/niveles_costos/analizar_niveles_costos.py"]
"muestra-h6" = ["-m", "Code.hito6.run"]
"figuras" = ["Code/Modeling/sensibilidad/informe_sensibilidad.py", "Code/Modeling/metricas/informe_metricas.py", "Code/Modeling/regla_sistemica/informe_regla_sistemica.py"]

