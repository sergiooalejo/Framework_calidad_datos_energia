"trazabilidad" = ["Code/Data_Acquisition_and_Understanding/trazabilidad/trazabilidad.py"]
"cuarentena" = ["Code/Data_Acquisition_and_Understanding/cuarentena_bootstrap/EPM/cuarentena.py", "Code/Data_Acquisition_and_Understanding/cuarentena_bootstrap/cuarentena_fuentes.py"]
"cartas" = ["Code/Modeling/cartas/EPM/cartas_log_epm.py", "Code/Modeling/cartas/CHEC/cartas_log_chec.py", "Code/Modeling/cartas/SSPD/cartas_log_sspd.py", "Code/Modeling/cartas/XM/cartas_log_xm.py"]
"revision-cartas" = ["Code/Modeling/cartas/revision_cartas_fuentes.py", "Code/Modeling/cartas/EPM/revision_cartas_epm.py"]
