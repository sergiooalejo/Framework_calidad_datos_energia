name: Calidad y reproducibilidad de energía
on:
  push:
    paths: ['repositorio/**', '.github/workflows/energia.yml']
  pull_request:
    paths: ['repositorio/**', '.github/workflows/energia.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: repositorio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.0'
      - name: Instalar entorno bloqueado
        run: |
          python -m pip install poetry==2.5.1
          poetry check --lock
          poetry sync --with dev --no-interaction
      - name: Pruebas
        run: poetry run pytest
      - name: Auditorías de datos y resultados
        run: poetry run python scripts/verificar.py --sin-pruebas
      - name: Construir y comprobar wheel aislado
        shell: bash
        run: |
          poetry build --format wheel
          poetry run python scripts/comprobar_wheel.py dist/*.whl
      - name: Comprobar contenedor
        if: runner.os == 'Linux'
        run: |
          docker compose config --quiet
          docker build -t energia-verificacion .
          docker run --rm energia-verificacion python scripts/verificar.py
